name: probelune_mobile
description: "Self-hosted multi-location monitoring companion for Probelune."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.13.7

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/app-icon.png
